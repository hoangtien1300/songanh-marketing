name: Daily Cloud SEO & Marketing Sync (06:00 AM VN)

on:
  schedule:
    # Chạy lúc 06:00 sáng giờ Việt Nam hàng ngày (UTC+7 -> UTC 23:00 hôm trước)
    # Khởi chạy trên Cloud độc lập, không cần mở máy tính laptop
    - cron: '00 23 * * *'
  workflow_dispatch: # Cho phép bấm Run workflow thủ công bất kỳ lúc nào trên GitHub

permissions:
  contents: write

jobs:
  seo-marketing-cloud-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl google-auth google-api-python-client google-analytics-data

      - name: Run Master Cloud Sync Pipeline
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python scripts/cron_daily_seo_check.py

      - name: Commit and Push Updated Data to Repository
        run: |
          git config --global user.name "Song Anh AI Agent"
          git config --global user.email "agent@songanhmodel.vn"
          git add marketing_data.json gsc_live_data.json ga4_live_data.json index.html song_anh_seo_keywords_historical_database.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto(seo): 06:00 AM daily cloud rank check & data sync [skip ci]" && git push origin main)
